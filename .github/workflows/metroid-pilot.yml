name: Verify exploratory GPT Metroidvania games
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build trusted isolated Chromium verifier
        run: docker build -f benchmarks/metroidvania_pilot/Dockerfile -t pact-metroid-verifier .
      - name: Evaluate unchanged model artifacts in restricted containers
        run: |
          image=$(docker image inspect --format '{{.Id}}' pact-metroid-verifier)
          python -m tools.check_metroid_pilot "$image"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metroidvania-pilot-evidence
          path: build/metroidvania-pilot/
