name: Verify isolated counter adapters
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build trusted runtime image
        run: docker build -f benchmarks/sandbox/Dockerfile -t pact-counter-verifier .
      - name: Exercise PACT/Python/JavaScript/C fixtures and output/timeout probes in isolated containers
        run: |
          image=$(docker image inspect --format '{{.Id}}' pact-counter-verifier)
          python -m tools.check_agent_sandbox "$image"
      - name: Retain completed trace when declaration execution times out
        run: |
          docker build -f benchmarks/sandbox/declaration-timeout.Dockerfile -t pact-counter-declaration-timeout .
          image=$(docker image inspect --format '{{.Id}}' pact-counter-declaration-timeout)
          python -m tools.check_agent_declaration_timeout "$image"
      - name: Evaluate archived exploratory GPT responses in Docker
        run: |
          image=$(docker image inspect --format '{{.Id}}' pact-counter-verifier)
          python -m tools.check_subagent_pilot "$image"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-counter-receipts
          path: |
            build/sandbox-checks/
            build/subagent-pilot/
