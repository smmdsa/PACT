name: Verify and publish PACT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pact-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install documentation build tools
        run: python3 -m pip install --disable-pip-version-check -r docs/site-requirements.txt
      - name: Test compiler and game
        run: python3 -m unittest discover -v
      - name: Measure representation sizes
        run: python3 -m benchmarks.source_sizes
      - name: Count source tokens with pinned benchmark tooling
        run: |
          python3 -m pip install --disable-pip-version-check -r benchmarks/requirements.txt
          mkdir -p build
          python3 -m benchmarks.token_counts --encoding o200k_base > build/tokens-o200k_base.json
          python3 -m benchmarks.token_counts --encoding cl100k_base > build/tokens-cl100k_base.json
          python3 -m benchmarks.traditional --encoding o200k_base --require-c > build/tokens-traditional-o200k_base.json
          python3 -m benchmarks.traditional --encoding cl100k_base --require-c > build/tokens-traditional-cl100k_base.json
          python3 -m benchmarks.data_compression --encoding o200k_base > build/tokens-data-o200k_base.json
          python3 -m benchmarks.data_compression --encoding cl100k_base > build/tokens-data-cl100k_base.json
          python3 -m benchmarks.data_compression --encoding o200k_base --include-literals > build/tokens-literals-o200k_base.json
          python3 -m benchmarks.data_compression --encoding cl100k_base --include-literals > build/tokens-literals-cl100k_base.json
      - name: Measure Gemini inline and combined representations
        run: |
          python3 -m benchmarks.data_compression --encoding o200k_base --include-literals --include-inline > build/tokens-inline-o200k_base.json
          python3 -m benchmarks.data_compression --encoding cl100k_base --include-literals --include-inline > build/tokens-inline-cl100k_base.json
          python3 -m pact check examples/alien-harvest.reset.pact
      - uses: actions/upload-artifact@v4
        with:
          name: token-baselines
          path: build/tokens-*.json
      - name: Build module 0.3 with export case evidence
        run: |
          python3 -m pact check examples/counter.tested.pact
          python3 -m pact build examples/counter.tested.pact -o build/counter.tested.wasm
      - name: Validate a revision-checked candidate
        run: |
          python3 -m pact patch examples/alien-harvest.pact --patch examples/patches/jump.patch.json --dry-run
          python3 -m pact patch examples/alien-harvest.pact --patch examples/patches/jump.patch.json -o build/higher-jump.pact
          python3 -m pact check build/higher-jump.pact
      - name: Validate compressed source and revision compatibility
        run: |
          python3 -m pact check examples/alien-harvest.data.pact
          python3 -m pact patch examples/alien-harvest.data.pact --patch examples/patches/jump.patch.json --dry-run
      - name: Smoke test runtime benchmark and freeze trial material
        run: |
          python3 -m benchmarks.runtime_performance --iterations 1000 --samples 2 --require-c > build/runtime-ci-smoke.json
          python3 -m benchmarks.agent_trials prepare --language pact --plan-seed 17 > build/agent-trial-pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-and-agent-material
          path: |
            build/runtime-ci-smoke.json
            build/agent-trial-pack.json
      - name: Compile checked examples and site
        run: python3 -m tools.build_site
      - name: Verify greeting capability host
        run: node host/run.mjs site-output/hello.wasm --allow stdout
      - name: Win through input-only playthrough
        run: |
          mkdir -p build
          node tools/playthrough.mjs site-output/game.wasm site-output/game.manifest.json build/playthrough.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: site-output
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site-output
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
